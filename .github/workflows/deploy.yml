name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets
        env:
          S_HOST: ${{ secrets.DEPLOY_HOST }}
          S_USER: ${{ secrets.DEPLOY_USER }}
          S_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          S_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -n "$S_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$S_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$S_KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$S_PATH" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (must be in Settings > Secrets and variables > Actions > Secrets, not Variables)"
            exit 1
          fi
          echo "All deploy secrets are present"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REACT_APP_API_URL=/api
            REACT_APP_CLIENT_KEY=wcm-frontend
          tags: ghcr.io/dabuldakov/world-country-monitoring-front:latest
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --prune origin main
            git reset --hard origin/main
            docker network inspect wcm-net >/dev/null 2>&1 || docker network create wcm-net
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            docker compose pull
            docker compose up -d --no-build
            docker image prune -f
